<section class="auth-page"><div class="auth-message"><span>Confirmação de cadastro</span><h1>Confirme seu e-mail</h1><p>Essa etapa protege sua conta e garante que você receberá as informações das encomendas.</p></div><div class="form-panel"><div class="form-card"><h2>Validação de e-mail</h2><p class="form-error" role="status">{{ message() }}</p>@if (success()) {<p class="alternative"><a routerLink="/login">Entrar na minha conta</a></p>} @else {<form [formGroup]="form" (ngSubmit)="resend()"><label>E-mail<input type="email" formControlName="email" autocomplete="email"></label><button type="submit" [disabled]="loading()">{{ loading() ? 'Aguarde...' : 'Reenviar confirmação' }}</button></form><p class="alternative"><a routerLink="/login">Voltar ao login</a></p>}</div></div></section>
