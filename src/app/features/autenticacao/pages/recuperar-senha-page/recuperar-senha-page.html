<section class="auth-page"><div class="auth-message"><span>Recuperação de acesso</span><h1>Esqueceu sua senha?</h1><p>Informe o e-mail cadastrado para receber um link temporário.</p></div><div class="form-panel"><div class="form-card"><h2>Recuperar senha</h2>@if(message()){<div class="form-error" role="status">{{message()}}</div>}<form [formGroup]="form" (ngSubmit)="submit()"><label>E-mail<input type="email" formControlName="email" autocomplete="email"></label><button [disabled]="sending()">{{sending()?'Enviando...':'Enviar instruções'}}</button></form><p class="alternative"><a routerLink="/login">Voltar ao login</a></p></div></div></section>
