<section class="auth-page"><div class="auth-message"><span>Novo acesso</span><h1>Defina uma nova senha</h1><p>O link é temporário e só poderá ser utilizado uma vez.</p></div><div class="form-panel"><div class="form-card"><h2>Redefinir senha</h2>@if(message()){<div class="form-error" role="status">{{message()}}</div>}@if(done()){<p class="alternative"><a routerLink="/login">Entrar com a nova senha</a></p>}@else{<form [formGroup]="form" (ngSubmit)="submit()"><label>Nova senha<input type="password" formControlName="novaSenha" autocomplete="new-password"></label><label>Confirmar senha<input type="password" formControlName="confirmacao" autocomplete="new-password"></label><button [disabled]="saving()">{{saving()?'Salvando...':'Redefinir senha'}}</button></form>}</div></div></section>
