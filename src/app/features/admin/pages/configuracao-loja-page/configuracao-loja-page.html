<section class="config-page"><header><span>Loja</span><h1>Configurações</h1><p>Defina as formas de entrega e os dados apresentados ao cliente durante o pagamento.</p></header>@if(message()){<p class="message">{{message()}}</p>}@if(loading()){<div class="state">Carregando...</div>}@else{<form [formGroup]="form" (ngSubmit)="save()"><section><h2>Entrega</h2><label class="switch"><input type="checkbox" formControlName="entregaHabilitada"><span><strong>Permitir entrega</strong><small>Quando desativada, o checkout apresentará somente retirada na oficina.</small></span></label></section><section><h2>Dados para pagamento</h2><label>Chave PIX<input formControlName="chavePix" placeholder="CPF, CNPJ, e-mail, telefone ou chave aleatória"><small>Será exibida ao cliente quando PIX for selecionado.</small></label><label>Dados da conta para depósito<textarea formControlName="dadosDeposito" rows="6" placeholder="Banco, agência, conta, favorecido e documento"></textarea><small>Serão exibidos quando depósito for selecionado.</small></label></section><button type="submit" [disabled]="saving()">{{saving()?'Salvando...':'Salvar configurações'}}</button></form>}</section>
