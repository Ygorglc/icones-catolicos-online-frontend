<section class="profile-page"><header><span>Minha conta</span><h1>Configurações de perfil</h1><p>Consulte e mantenha seus dados cadastrais atualizados.</p></header>@if(loading()){<div class="state">Carregando perfil...</div>}@else if(error()){<div class="state"><h2>Não foi possível carregar seus dados</h2><button type="button" (click)="load()">Tentar novamente</button></div>}@else{<form [formGroup]="form" (ngSubmit)="save()">@if(message()){<p class="message" role="status">{{message()}}</p>}<div class="fields"><label>Nome completo<input formControlName="nome" autocomplete="name">@if(form.controls.nome.touched&&form.controls.nome.invalid){<small>Informe seu nome.</small>}</label><label>E-mail<input type="email" formControlName="email"><small>O e-mail identifica seu acesso e não pode ser alterado nesta tela.</small></label><label>Telefone<input formControlName="telefone" autocomplete="tel"></label><label>CPF<input formControlName="cpf" maxlength="11" inputmode="numeric">@if(form.controls.cpf.touched&&form.controls.cpf.invalid){<small>Informe exatamente 11 dígitos.</small>}</label><label class="full">Endereço<textarea rows="4" formControlName="endereco" autocomplete="street-address"></textarea></label></div><button type="submit" [disabled]="saving()">{{saving()?'Salvando...':'Salvar alterações'}}</button></form>}</section>
