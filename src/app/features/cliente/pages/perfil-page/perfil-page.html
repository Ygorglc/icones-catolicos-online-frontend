<section class="profile-page"><header><span>Minha conta</span><h1>Configurações de perfil</h1><p>Consulte e mantenha seus dados cadastrais atualizados.</p></header>@if(loading()){<div class="state">Carregando perfil...</div>}@else if(error()){<div class="state"><h2>Não foi possível carregar seus dados</h2><button type="button" (click)="load()">Tentar novamente</button></div>}@else{@if(message()){<p class="message" role="status">{{message()}}</p>}<form [formGroup]="form" (ngSubmit)="save()"><h2>Dados cadastrais</h2><div class="fields"><label>Nome completo<input formControlName="nome" autocomplete="name"></label><label>E-mail<input type="email" formControlName="email"><small>O e-mail identifica seu acesso e não pode ser alterado nesta tela.</small></label><label>Telefone<input formControlName="telefone" autocomplete="tel" inputmode="numeric" maxlength="11"></label><label>CPF<input formControlName="cpf" maxlength="11" inputmode="numeric"></label><label>CEP<input formControlName="cep" maxlength="8" inputmode="numeric" autocomplete="postal-code">@if(form.controls.cep.touched&&form.controls.cep.invalid){<small>Informe um CEP válido com 8 dígitos.</small>}</label><label class="full">Logradouro<input formControlName="logradouro" autocomplete="address-line1"></label><label>Número<input formControlName="numero" autocomplete="address-line2"></label><label>Complemento <em>opcional</em><input formControlName="complemento" autocomplete="address-line3"></label><label>Bairro<input formControlName="bairro"></label><label>Cidade<input formControlName="cidade" autocomplete="address-level2"></label><label>Estado<select formControlName="uf" autocomplete="address-level1"><option value="" disabled>Selecione o estado</option>@for(estado of estados;track estado.sigla){<option [value]="estado.sigla">{{estado.nome}} ({{estado.sigla}})</option>}</select></label></div><button type="submit" [disabled]="saving()">{{saving()?'Salvando...':'Salvar alterações'}}</button></form><form [formGroup]="passwordForm" (ngSubmit)="changePassword()"><h2>Alterar senha</h2><div class="fields"><label>Senha atual<input type="password" formControlName="senhaAtual" autocomplete="current-password"></label><label>Nova senha<input type="password" formControlName="novaSenha" autocomplete="new-password"></label><label>Confirmar nova senha<input type="password" formControlName="confirmacao" autocomplete="new-password"></label></div><button type="submit" [disabled]="saving()">Alterar senha</button></form>}</section>
