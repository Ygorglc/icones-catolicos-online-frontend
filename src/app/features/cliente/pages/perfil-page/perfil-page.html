<section class="profile-page"><header><span>Minha conta</span><h1>Configurações de perfil</h1><p>Consulte e mantenha seus dados cadastrais atualizados.</p></header>@if(loading()){<div class="state">Carregando perfil...</div>}@else if(error()){<div class="state"><h2>Não foi possível carregar seus dados</h2><button type="button" (click)="load()">Tentar novamente</button></div>}@else{@if(message()){<p class="message" role="status">{{message()}}</p>}<form [formGroup]="form" (ngSubmit)="save()"><h2>Dados cadastrais</h2><div class="fields"><label>Nome completo<input formControlName="nome" autocomplete="name"></label><label>E-mail<input type="email" formControlName="email"><small>O e-mail identifica seu acesso e não pode ser alterado nesta tela.</small></label><label>Telefone<input formControlName="telefone" autocomplete="tel"></label><label>CPF<input formControlName="cpf" maxlength="11" inputmode="numeric"></label><label class="full">Endereço<textarea rows="4" formControlName="endereco" autocomplete="street-address"></textarea></label></div><button type="submit" [disabled]="saving()">{{saving()?'Salvando...':'Salvar alterações'}}</button></form><form [formGroup]="passwordForm" (ngSubmit)="changePassword()"><h2>Alterar senha</h2><div class="fields"><label>Senha atual<input type="password" formControlName="senhaAtual" autocomplete="current-password"></label><label>Nova senha<input type="password" formControlName="novaSenha" autocomplete="new-password"></label><label>Confirmar nova senha<input type="password" formControlName="confirmacao" autocomplete="new-password"></label></div><button type="submit" [disabled]="saving()">Alterar senha</button></form>}</section>
