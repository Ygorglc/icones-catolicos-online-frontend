@if (loadingService.isLoading()) {
  <div class="loading-bar" role="progressbar" aria-label="Carregando"></div>
}

@if (apiErrorService.error(); as error) {
  <aside class="error-notification" role="alert">
    <div><strong>{{ error.title }}</strong><p>{{ error.message }}</p></div>
    <button type="button" aria-label="Fechar aviso" (click)="apiErrorService.clear()">×</button>
  </aside>
}

<router-outlet />
